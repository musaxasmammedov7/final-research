---
# ==============================================================================
# PLAY 1: Подготовка всех 3 серверов (Ядро Linux 6.8+, CRIU, CRI-O v1.31, Buildah, Kubelet)
# ==============================================================================
- name: "Этап 1: Настройка ядра Linux, CRIU, CRI-O v1.31 и Buildah на всех узлах"
  hosts: k8s_cluster
  become: true
  gather_facts: false
  pre_tasks:
    - name: "1.0 Ожидание готовности SSH на всех 3 серверах после старта EC2"
      ansible.builtin.wait_for_connection:
        timeout: 180
        delay: 5
    - name: "1.0b Сбор системных фактов (setup)"
      ansible.builtin.setup:
  tasks:
    - name: "1.1 Установка имени хоста (hostname = k8s-master / k8s-worker-1 / k8s-worker-2)"
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: "1.2 Отключение Swap в оперативной памяти (требование kubelet и для чистых дампов CRIU)"
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: "1.3 Удаление Swap из /etc/fstab"
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: "1.4 Конфигурация автозагрузки модулей ядра overlay и br_netfilter"
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s-criu.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: "1.5 Немедленная загрузка модулей ядра overlay и br_netfilter"
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: "1.6 Тонкая настройка параметров ядра sysctl для Cilium eBPF и CRIU"
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k8s-criu-ebpf.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
          net.ipv4.conf.all.rp_filter         = 0
          net.ipv4.conf.default.rp_filter     = 0
          vm.unprivileged_userfaultfd         = 1
          net.netfilter.nf_conntrack_tcp_loose = 1

    - name: "1.7 Применение настроек sysctl"
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: "1.7b Подключение официального PPA-репозитория CRIU (ppa:criu/ppa) для Ubuntu 24.04"
      ansible.builtin.command: add-apt-repository -y ppa:criu/ppa
      args:
        creates: /etc/apt/sources.list.d/criu-ubuntu-ppa-noble.sources

    - name: "1.8 Установка системных пакетов: CRIU, crun, buildah, skopeo, conntrack, bpftool"
      ansible.builtin.apt:
        update_cache: true
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - socat
          - conntrack
          - ipset
          - iproute2
          - nftables
          - iptables
          - criu
          - libcriu2
          - crun
          - runc
          - conmon
          - buildah
          - skopeo
          - rsync
          - linux-tools-common
        state: present

    - name: "1.8b Создание каталога конфигурации /etc/criu"
      ansible.builtin.file:
        path: /etc/criu
        state: directory
        mode: "0755"

    - name: "1.9 Настройка /etc/criu/default.conf (tcp-close: установленные TCP-соединения не переносятся, слушающие сокеты восстанавливаются)"
      ansible.builtin.copy:
        dest: /etc/criu/default.conf
        mode: "0644"
        # Источник: https://criu.org/CLI/opt/--tcp-close - опция позволяет мигрировать серверы, слушающие 0.0.0.0,
        # в окружение с другим IP: все TCP-соединения кроме CLOSED/LISTEN восстанавливаются закрытыми.
        # tcp-established здесь НЕ используется: у пода на другой ноде будет другой Pod IP.
        content: |
          tcp-close
          shell-job
          ext-unix-sk
          skip-in-flight
          skip-mnt /run/.containerenv

    - name: "1.10 Добавление официальных GPG-ключей Kubernetes v1.31 и CRI-O v1.31"
      ansible.builtin.shell: |
        mkdir -p -m 755 /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        curl -fsSL https://pkgs.k8s.io/addons:/cri-o:/stable:/v1.31/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/cri-o-apt-keyring.gpg

    - name: "1.11 Подключение официальных репозиториев Kubernetes v1.31 и CRI-O v1.31"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes-crio.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /
          deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://pkgs.k8s.io/addons:/cri-o:/stable:/v1.31/deb/ /

    - name: "1.12 Установка эталонного рантайма CRI-O v1.31 и Kubernetes (kubelet, kubeadm, kubectl, cri-tools)"
      ansible.builtin.apt:
        update_cache: true
        name:
          - cri-o
          - cri-tools
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: "1.13 Включение поддержки CRIU Checkpoint/Restore в CRI-O (/etc/crio/crio.conf.d/99-criu.conf)"
      ansible.builtin.shell: |
        if [ -x /usr/libexec/crio/runc ]; then
          OCI_RT="runc"
          OCI_PATH="/usr/libexec/crio/runc"
        else
          OCI_RT="runc"
          OCI_PATH=$(command -v runc)
        fi
        cat <<EOF > /etc/crio/crio.conf.d/99-criu.conf
        [crio.runtime]
        enable_criu_support = true
        default_runtime = "${OCI_RT}"

        [crio.runtime.runtimes.${OCI_RT}]
        runtime_path = "${OCI_PATH}"
        runtime_type = "oci"
        runtime_root = "/run/${OCI_RT}"
        EOF
      changed_when: false

    - name: "1.13b Удаление дефолтного bridge-CNI конфига CRI-O (чтобы сетью подов управлял только Cilium)"
      ansible.builtin.shell: rm -f /etc/cni/net.d/*crio-bridge*.conflist /etc/cni/net.d/*crio-bridge*.conf
      changed_when: false

    - name: "1.13c Отключение signature_policy в CRI-O (валидация подписей не поддерживается при container restore)"
      ansible.builtin.shell: |
        sed -i 's/^signature_policy/#signature_policy/' /etc/crio/crio.conf.d/10-crio.conf 2>/dev/null || true
      changed_when: false

    - name: "1.14 Разрешение локального HTTP-реестра (10.10.1.10:5000) для пересылки OCI-образов чекпоинтов"
      ansible.builtin.copy:
        dest: /etc/containers/registries.conf.d/99-local-checkpoint-registry.conf
        mode: "0644"
        content: |
          [[registry]]
          location = "10.10.1.10:5000"
          insecure = true

    - name: "1.14b Настройка /etc/crictl.yaml для работы crictl напрямую с сокетом CRI-O"
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        mode: "0644"
        content: |
          runtime-endpoint: unix:///var/run/crio/crio.sock
          image-endpoint: unix:///var/run/crio/crio.sock
          timeout: 30

    - name: "1.15 Запуск и включение служб cri-o и kubelet"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
        daemon_reload: true
      loop:
        - crio
        - kubelet

    - name: "1.16 Предварительная загрузка базового образа python:3.12-slim во все узлы CRI-O (обязательно для CRI-O Restore на worker-2)"
      ansible.builtin.command: crictl pull docker.io/library/python:3.12-slim
      changed_when: false


# ==============================================================================
# PLAY 2: Инициализация Control Plane, установка Cilium Service Mesh и OCI Registry
# ==============================================================================
- name: "Этап 2: Инициализация Kubernetes Master (CRI-O) и развертывание Cilium Service Mesh (eBPF)"
  hosts: master
  become: true
  tasks:
    - name: "2.1 Проверка, инициализирован ли уже кластер"
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: "2.2 Запуск kubeadm init с рантаймом CRI-O (без kube-proxy — его заменяет Cilium eBPF)"
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ private_ip }}
        --pod-network-cidr=10.244.0.0/16
        --cri-socket=unix:///var/run/crio/crio.sock
        --skip-phases=addon/kube-proxy
      when: not k8s_admin_conf.stat.exists

    - name: "2.3 Настройка kubeconfig для пользователя ubuntu"
      ansible.builtin.shell: |
        mkdir -p /home/ubuntu/.kube
        cp -f /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown -R ubuntu:ubuntu /home/ubuntu/.kube
      changed_when: false

    - name: "2.4 Установка Cilium CLI на мастер-ноду"
      ansible.builtin.shell: |
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        curl -L --fail --remote-name-all "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz"
        tar xzvfC cilium-linux-amd64.tar.gz /usr/local/bin
        rm -f cilium-linux-amd64.tar.gz
      args:
        creates: /usr/local/bin/cilium

    - name: "2.5 Проверка, установлен ли уже Cilium в кластере"
      become: false
      ansible.builtin.command: kubectl -n kube-system get daemonset cilium
      register: cilium_ds
      failed_when: false
      changed_when: false

    - name: "2.6 Установка Cilium Service Mesh с pure eBPF (ClusterIP Ingress, без NodePort)"
      become: false
      ansible.builtin.command: >
        cilium install
        --version 1.16.3
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ private_ip }}
        --set k8sServicePort=6443
        --set ipam.operator.clusterPoolIPv4PodCIDRList="{10.244.0.0/16}"
        --set bpf.masquerade=true
        --set l7Proxy=true
        --set ingressController.enabled=true
        --set ingressController.default=true
        --set ingressController.loadbalancerMode=shared
        --set ingressController.enforceHttps=false
        --set ingressController.service.type=ClusterIP
        --set hubble.enabled=true
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
      when: cilium_ds.rc != 0

    - name: "2.6b Настройка чистого eBPF Ingress через externalIPs (без NodePort и без iptables)"
      become: false
      ansible.builtin.command: >
        kubectl patch svc cilium-ingress -n kube-system --type='json'
        -p='[{"op": "replace", "path": "/spec/type", "value": "ClusterIP"}, {"op": "remove", "path": "/spec/externalTrafficPolicy"}, {"op": "add", "path": "/spec/externalIPs", "value": ["{{ private_ip }}"]}]'
      changed_when: false
      failed_when: false

    - name: "2.7 Генерация команды присоединения (join command) для Worker-нод"
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: "2.8 Сохранение команды подключения воркеров (с указанием сокета CRI-O)"
      ansible.builtin.set_fact:
        k8s_join_command: "{{ join_command_raw.stdout }} --cri-socket=unix:///var/run/crio/crio.sock"


# ==============================================================================
# PLAY 3: Присоединение Worker-нод и выдача сертификата для Kubelet Checkpoint API
# ==============================================================================
- name: "Этап 3: Подключение k8s-worker-1 и k8s-worker-2 к кластеру"
  hosts: workers
  become: true
  tasks:
    - name: "3.1 Проверка, подключен ли уже воркер к кластеру"
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: "3.2 Присоединение воркера к кластеру (kubeadm join через CRI-O)"
      ansible.builtin.command: "{{ hostvars['k8s-master'].k8s_join_command }}"
      when: not kubelet_conf.stat.exists


# ==============================================================================
# PLAY 4: Развертывание локального OCI-реестра чекпоинтов, cert-manager и манифестов
# ==============================================================================
- name: "Этап 4: Запуск OCI Registry, cert-manager, 11 микросервисов и CRI-O/Buildah Оператора"
  hosts: master
  become: false
  tasks:
    - name: "4.1 Ожидание перехода всех подов Cilium и нод в состояние Ready"
      ansible.builtin.command: cilium status --wait
      changed_when: false

    - name: "4.2 Автоматическая привязка Public IP сервера к домену {{ duckdns_domain }}.duckdns.org"
      ansible.builtin.uri:
        url: "https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}&ip={{ master_public_ip }}"
        return_content: true
      when: duckdns_token | length > 0

    - name: "4.3 Установка cert-manager (Let's Encrypt SSL для Cilium Ingress)"
      ansible.builtin.command: >
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
      changed_when: false

    - name: "4.4 Ожидание готовности cert-manager"
      ansible.builtin.command: >
        kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=180s
      changed_when: false

    - name: "4.5 Копирование манифестов и скриптов бенчмарка на мастер"
      ansible.builtin.copy:
        src: "../manifests/"
        dest: "/home/ubuntu/manifests/"
        mode: "0644"

    - name: "4.5b Копирование скрипта замеров (benchmark_migration.py) на мастер"
      ansible.builtin.copy:
        src: "../scripts/"
        dest: "/home/ubuntu/scripts/"
        mode: "0755"

    - name: "4.6 Развертывание всех манифестов (Cert-Manager, Boutique, Live-Demo, Ingress, CRI-O Operator)"
      ansible.builtin.shell: |
        kubectl apply -f /home/ubuntu/manifests/01-cert-manager-issuer.yaml
        kubectl apply -f /home/ubuntu/manifests/02-google-online-boutique.yaml
        kubectl apply -f /home/ubuntu/manifests/03-live-migration-stream-demo.yaml
        kubectl apply -f /home/ubuntu/manifests/04-cilium-ingress-https.yaml
        kubectl apply -f /home/ubuntu/manifests/05-live-migration-operator.yaml
      changed_when: false

    - name: "4.6b Ожидание готовности реестра чекпоинтов, демонстрационного пода и оператора"
      ansible.builtin.shell: |
        kubectl wait --for=condition=Available deployment/checkpoint-registry -n boutique --timeout=180s
        kubectl wait --for=condition=Ready pod/live-stream-pod -n boutique --timeout=180s
        kubectl wait --for=condition=Available deployment/redis-cart -n boutique --timeout=180s
      changed_when: false

    - name: "4.7 Вывод списка узлов, подов и проверка пула Cilium (cluster-pool)"
      ansible.builtin.shell: |
        cilium config view | grep cluster-pool
        kubectl get nodes -o wide
        kubectl get pods -n boutique -o wide
      register: nodes_out
      changed_when: false

    - name: "4.7b Smoke-test: Cilium Ingress через eBPF ClusterIP (без iptables и NodePort)"
      ansible.builtin.shell: >
        INGRESS_IP=$(kubectl -n kube-system get svc cilium-ingress -o jsonpath='{.spec.clusterIP}') &&
        curl -s -o /dev/null -w '%{http_code}'
        -H 'Host: {{ duckdns_domain }}.duckdns.org'
        http://${INGRESS_IP}/live/state
      register: ingress_smoke
      changed_when: false
      failed_when: false
      retries: 12
      delay: 5
      until: ingress_smoke.stdout == "200"

    - name: "4.7c Результат smoke-теста Ingress (ожидается 200; чистый eBPF ClusterIP)"
      ansible.builtin.debug:
        msg: "HTTP status /live/state via pure eBPF Cilium Ingress = {{ ingress_smoke.stdout }}"

    - name: "4.8 Статус кластера"
      ansible.builtin.debug:
        msg: "{{ nodes_out.stdout_lines }}"
