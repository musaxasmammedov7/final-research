# ==============================================================================
# АВТОНОМНЫЙ ОПЕРАТОР ЖИВОЙ МИГРАЦИИ ПАМЯТИ (CRI-O + CRIU + Buildah + Registry)
# ------------------------------------------------------------------------------
# Реализует полный эталонный цикл по документации Kubernetes KEP-2008 / CRI-O:
# 1. Внутренний OCI-реестр чекпоинтов (10.10.1.10:5000) на мастер-ноде;
# 2. Автоматическое обнаружение 3 официальных триггеров из KEP-2008 (NodeMaintenance,
#    SpotInstancePreemption, ClusterConsolidation);
# 3. Выполнение полного 4-шагового пайплайна на исходном воркере (DaemonSet + nsenter):
#    - T_dump:     POST /checkpoint/boutique/live-stream-pod/stream-server
#    - T_build:    buildah from scratch + add tar + io.kubernetes.cri-o.annotations.checkpoint.name=stream-server
#    - T_transfer: buildah push --tls-verify=false 10.10.1.10:5000/stream-server-checkpoint:latest
#    - T_restore:  Привязка нового пода через spec.nodeName к целевому воркеру (k8s-worker-2)
#                  и ожидание реального HTTP 200 ответа от восстановленного процесса!
# ==============================================================================

# 0. Локальный OCI Registry на мастер-ноде (10.10.1.10:5000) для обмена образами чекпоинтов
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkpoint-registry
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkpoint-registry
  template:
    metadata:
      labels:
        app: checkpoint-registry
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      tolerations:
        - operator: Exists
      containers:
        - name: registry
          image: docker.io/library/registry:2
          ports:
            - containerPort: 5000
---
# 1. Регистрация CRD `kind: PodLiveMigration` (короткое имя: plm)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podlivemigrations.migration.research.io
spec:
  group: migration.research.io
  names:
    kind: PodLiveMigration
    listKind: PodLiveMigrationList
    plural: podlivemigrations
    singular: podlivemigration
    shortNames:
      - plm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .spec.podName
        - name: Source
          type: string
          jsonPath: .spec.sourceNode
        - name: Target
          type: string
          jsonPath: .spec.targetNode
        - name: TriggerReason
          type: string
          jsonPath: .spec.triggerReason
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: TotalDowntime
          type: string
          jsonPath: .status.totalDowntime
        - name: Breakdown
          type: string
          jsonPath: .status.breakdown
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["podName", "sourceNode", "targetNode"]
              properties:
                podName:
                  type: string
                sourceNode:
                  type: string
                targetNode:
                  type: string
                triggerReason:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                totalDowntime:
                  type: string
                breakdown:
                  type: string
                message:
                  type: string
---
# 2. Права доступа (ServiceAccount + ClusterRoleBinding cluster-admin для вызова kubelet checkpoint API :10250)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: live-migration-operator-sa
  namespace: boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: live-migration-operator-admin
subjects:
  - kind: ServiceAccount
    name: live-migration-operator-sa
    namespace: boutique
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# 3. Код Автономного Оператора (DaemonSet на воркерах с доступом к Buildah и /var/lib/kubelet/checkpoints)
apiVersion: v1
kind: ConfigMap
metadata:
  name: live-migration-operator-code
  namespace: boutique
data:
  controller.py: |
    import json
    import os
    import socket
    import ssl
    import subprocess
    import time
    import urllib.request

    APISERVER = "https://kubernetes.default.svc"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    MY_NODE = os.environ.get("NODE_NAME", socket.gethostname())
    REGISTRY_IMAGE = "10.10.1.10:5000/stream-server-checkpoint:latest"

    def get_token():
        with open(TOKEN_PATH, "r") as f:
            return f.read().strip()

    def k8s_request(path, method="GET", body=None, content_type="application/json"):
        token = get_token()
        ctx = ssl.create_default_context()
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE
        headers = {"Authorization": f"Bearer {token}", "Content-Type": content_type}
        data = json.dumps(body).encode("utf-8") if body is not None else None
        req = urllib.request.Request(f"{APISERVER}{path}", data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def host_cmd(cmd_str):
        """Выполняет команду в корневом пространстве имен ноды (nsenter в PID 1) для доступа к /var/lib/kubelet/checkpoints и buildah."""
        return subprocess.run(
            ["nsenter", "-t", "1", "-m", "-u", "-i", "-n", "bash", "-c", cmd_str],
            capture_output=True, text=True, check=True
        )

    def probe_pod_counter(pod_ip, timeout=0.5):
        if not pod_ip:
            return None
        try:
            with urllib.request.urlopen(f"http://{pod_ip}:8090/live/state", timeout=timeout) as r:
                if r.status == 200:
                    return json.loads(r.read().decode("utf-8")).get("ram_counter")
        except Exception:
            return None
        return None

    def notify_restored_pod(pod_ip, payload):
        try:
            data = json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(
                f"http://{pod_ip}:8090/live/record",
                data=data,
                headers={"Content-Type": "application/json"},
                method="POST",
            )
            with urllib.request.urlopen(req, timeout=2) as r:
                return r.status == 200
        except Exception:
            return False

    def detect_node_hazard(node):
        spec = node.get("spec", {})
        labels = node.get("metadata", {}).get("labels", {})
        if spec.get("unschedulable") is True:
            return "NodeMaintenance"
        if labels.get("spot-interruption") == "true":
            return "SpotInstancePreemption"
        if labels.get("consolidate-node") == "true":
            return "ClusterConsolidation"
        return None

    def auto_watch_cluster():
        nodes = k8s_request("/api/v1/nodes").get("items", [])
        healthy_workers = []
        hazard_nodes = {}

        for n in nodes:
            name = n["metadata"]["name"]
            if "master" in name or "control-plane" in n["metadata"].get("labels", {}):
                continue
            reason = detect_node_hazard(n)
            if reason:
                hazard_nodes[name] = reason
            else:
                healthy_workers.append(name)

        if MY_NODE not in hazard_nodes or not healthy_workers:
            return

        pods = k8s_request("/api/v1/namespaces/boutique/pods").get("items", [])
        existing_plms = k8s_request("/apis/migration.research.io/v1alpha1/namespaces/boutique/podlivemigrations").get("items", [])
        active_pods = {p["spec"]["podName"] for p in existing_plms if p.get("status", {}).get("phase") not in ("Succeeded", "Failed")}

        for pod in pods:
            pod_name = pod["metadata"]["name"]
            node_name = pod["spec"].get("nodeName")
            if pod_name == "live-stream-pod" and node_name == MY_NODE and pod_name not in active_pods:
                target_node = healthy_workers[0]
                reason = hazard_nodes[MY_NODE]
                plm_name = f"migrate-{pod_name}-{int(time.time())}"
                body = {
                    "apiVersion": "migration.research.io/v1alpha1",
                    "kind": "PodLiveMigration",
                    "metadata": {"name": plm_name, "namespace": "boutique"},
                    "spec": {
                        "podName": pod_name,
                        "sourceNode": MY_NODE,
                        "targetNode": target_node,
                        "triggerReason": reason,
                    },
                }
                k8s_request("/apis/migration.research.io/v1alpha1/namespaces/boutique/podlivemigrations", method="POST", body=body)

    def update_status(ns, name, phase, total_dt="-", breakdown="-", msg=""):
        patch = {"status": {"phase": phase, "totalDowntime": total_dt, "breakdown": breakdown, "message": msg}}
        k8s_request(
            f"/apis/migration.research.io/v1alpha1/namespaces/{ns}/podlivemigrations/{name}/status",
            method="PATCH", body=patch, content_type="application/merge-patch+json"
        )

    def execute_migration_pipeline(ns, plm_name, pod_name, src_node, dst_node, reason):
        update_status(ns, plm_name, "Migrating", "-", "Step 1/4: Kubelet CRIU Checkpoint", f"[{reason}] Starting CRI-O checkpoint")
        token = get_token()
        ckpt_image = f"10.10.1.10:5000/stream-server-checkpoint:{plm_name}"

        src_pod = k8s_request(f"/api/v1/namespaces/{ns}/pods/{pod_name}")
        src_pod_ip = src_pod.get("status", {}).get("podIP")
        counter_at_dump = probe_pod_counter(src_pod_ip)

        # ШАГ 1: Kubelet Checkpoint API (:10250/checkpoint с Bearer-аутентификацией cluster-admin)
        t0 = time.monotonic()
        host_cmd(f"rm -f /var/lib/kubelet/checkpoints/checkpoint-{pod_name}_{ns}-stream-server-*.tar")
        host_cmd(f"curl -skf -X POST -H 'Authorization: Bearer {token}' https://localhost:10250/checkpoint/{ns}/{pod_name}/stream-server")
        t1 = time.monotonic()
        dump_ms = int((t1 - t0) * 1000)

        # ШАГ 2: Упаковка архива чекпоинта в OCI-образ через Buildah с аннотацией CRI-O
        update_status(ns, plm_name, "Migrating", "-", f"Dump={dump_ms}ms | Step 2/4: Buildah OCI", "Packaging CRIU tar into OCI image")
        build_script = f"""
        set -e
        TAR_FILE=$(ls -t /var/lib/kubelet/checkpoints/checkpoint-{pod_name}_{ns}-stream-server-*.tar | head -n 1)
        CID=$(buildah from scratch)
        buildah add "$CID" "$TAR_FILE" /
        MNT=$(buildah mount "$CID")
        if [ -f "$MNT/config.dump" ]; then
          python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); d["rootfsImageName"]="docker.io/library/python:3.12-slim"; json.dump(d,open(p,"w"))' "$MNT/config.dump"
        fi
        buildah umount "$CID"
        buildah config --annotation=io.kubernetes.cri-o.annotations.checkpoint.name=stream-server "$CID"
        buildah commit "$CID" {ckpt_image}
        buildah rm "$CID"
        """
        host_cmd(build_script)
        t2 = time.monotonic()
        build_ms = int((t2 - t1) * 1000)

        # ШАГ 3: Отправка OCI-образа чекпоинта во внутренний HTTP-реестр кластера (tls-verify=false)
        update_status(ns, plm_name, "Migrating", "-", f"Dump={dump_ms}ms, Build={build_ms}ms | Step 3/4: Push", "Pushing OCI checkpoint image")
        host_cmd(f"buildah push --tls-verify=false {ckpt_image}")
        t3 = time.monotonic()
        push_ms = int((t3 - t2) * 1000)

        # Замеряем счетчик на исходной ноде непосредственно перед удалением пода (пока шли Build + Push, под продолжал считать)
        counter_at_kill = probe_pod_counter(src_pod_ip)
        t_kill = time.monotonic()

        # ШАГ 4: Удаление старого пода на src_node и запуск восстановленного пода на dst_node через spec.nodeName
        update_status(ns, plm_name, "Migrating", "-", f"Dump={dump_ms}ms, Build={build_ms}ms, Push={push_ms}ms | Step 4/4: Restore", f"Restoring on {dst_node}")
        k8s_request(f"/api/v1/namespaces/{ns}/pods/{pod_name}?gracePeriodSeconds=0", method="DELETE")
        for _ in range(50):
            try:
                k8s_request(f"/api/v1/namespaces/{ns}/pods/{pod_name}")
                time.sleep(0.1)
            except Exception:
                break

        restored_pod = {
            "apiVersion": "v1",
            "kind": "Pod",
            "metadata": {"name": pod_name, "namespace": ns, "labels": {"app": "live-stream"}},
            "spec": {
                "automountServiceAccountToken": False,
                "nodeName": dst_node,
                "tolerations": [{"operator": "Exists"}],
                "containers": [{
                    "name": "stream-server",
                    "image": ckpt_image,
                    "imagePullPolicy": "Always",
                    "ports": [{"containerPort": 8090}],
                }],
            },
        }
        k8s_request(f"/api/v1/namespaces/{ns}/pods", method="POST", body=restored_pod)

        # Ожидание не просто статуса Running, а реального ответа HTTP 200 от восстановленного процесса на dst_node!
        dst_pod_ip = None
        counter_at_restore = None
        for _ in range(300):
            p = k8s_request(f"/api/v1/namespaces/{ns}/pods/{pod_name}")
            if p.get("status", {}).get("phase") == "Running":
                dst_pod_ip = p.get("status", {}).get("podIP")
                c_val = probe_pod_counter(dst_pod_ip, timeout=0.2)
                if c_val is not None:
                    counter_at_restore = c_val
                    break
            time.sleep(0.05)

        if counter_at_restore is None:
            raise RuntimeError(f"CRI-O restore or HTTP 200 verification failed on {dst_node}")

        t4 = time.monotonic()
        restore_ms = int((t4 - t3) * 1000)
        http_blackout_ms = int((t4 - t_kill) * 1000)
        total_ms = int((t4 - t0) * 1000)
        breakdown = (
            f"Dump:{dump_ms}ms | Build:{build_ms}ms | Push:{push_ms}ms | Restore:{restore_ms}ms "
            f"| HTTP_Blackout:{http_blackout_ms}ms | Counter({counter_at_dump}->{counter_at_kill}->{counter_at_restore})"
        )

        if dst_pod_ip:
            notify_restored_pod(dst_pod_ip, {
                "name": plm_name,
                "source": src_node,
                "target": dst_node,
                "reason": reason,
                "phase": "Succeeded",
                "downtime": f"{total_ms}ms (HTTP blackout: {http_blackout_ms}ms)",
                "breakdown": breakdown,
            })

        update_status(
            ns, plm_name, "Succeeded", f"{total_ms}ms (HTTP:{http_blackout_ms}ms)", breakdown,
            f"Restored via CRI-O on {dst_node} (counter: dump={counter_at_dump}, kill={counter_at_kill}, restore={counter_at_restore})"
        )

    def reconcile():
        while True:
            try:
                auto_watch_cluster()
                res = k8s_request("/apis/migration.research.io/v1alpha1/namespaces/boutique/podlivemigrations")
                for item in res.get("items", []):
                    name = item["metadata"]["name"]
                    ns = item["metadata"]["namespace"]
                    status = item.get("status", {})
                    if status.get("phase") in ("Succeeded", "Failed", "Migrating"):
                        continue
                    spec = item["spec"]
                    if spec["sourceNode"] != MY_NODE:
                        continue
                    try:
                        execute_migration_pipeline(
                            ns, name, spec["podName"], spec["sourceNode"], spec["targetNode"], spec.get("triggerReason", "Manual")
                        )
                    except Exception as pipe_err:
                        update_status(ns, name, "Failed", "-", str(pipe_err)[:120], f"Pipeline error: {pipe_err}")
            except Exception as e:
                print(f"Operator loop error: {e}", flush=True)
            time.sleep(1)

    if __name__ == "__main__":
        reconcile()
---
# 4. DaemonSet Оператора на воркер-нодах
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: live-migration-operator
  namespace: boutique
spec:
  selector:
    matchLabels:
      app: live-migration-operator
  template:
    metadata:
      labels:
        app: live-migration-operator
    spec:
      serviceAccountName: live-migration-operator-sa
      hostNetwork: true
      hostPID: true
      containers:
        - name: operator
          image: docker.io/library/python:3.12-slim
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["python3", "/operator/controller.py"]
          volumeMounts:
            - name: operator-code
              mountPath: /operator
      volumes:
        - name: operator-code
          configMap:
            name: live-migration-operator-code
