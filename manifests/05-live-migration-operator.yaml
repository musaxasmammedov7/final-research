# ==============================================================================
# АВТОНОМНЫЙ ОПЕРАТОР ЖИВОЙ МИГРАЦИИ KUBERNETES (CRD + Auto-Detector + Controller)
# ------------------------------------------------------------------------------
# Оператор работает полностью АВТОМАТИЧЕСКИ (без ручного создания YAML!):
# Он в реальном времени мониторит состояние всех нод кластера (/api/v1/nodes)
# и сам автоматически создает `kind: PodLiveMigration` и запускает CRIU миграцию,
# как только обнаруживает любую из 5 угроз на ноде с живым подом:
#   1. Node Drain / Cordon (`node.spec.unschedulable == true`) — патч ядра/ребут;
#   2. Spot Interruption (`taint/label: spot-termination`) — отзыв Spot-сервера;
#   3. Pre-OOM MemoryPressure (`MemoryPressure == True`) — защита от OOMKiller;
#   4. Hardware / Network Degradation (`node-degraded == true`) — сбой железа;
#   5. Node Consolidation (`consolidate == true`) — уплотнение подов для экономии.
# ==============================================================================

# 1. Регистрация нового типа `kind: PodLiveMigration` в Kubernetes (CRD)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podlivemigrations.migration.research.io
spec:
  group: migration.research.io
  names:
    kind: PodLiveMigration
    listKind: PodLiveMigrationList
    plural: podlivemigrations
    singular: podlivemigration
    shortNames:
      - plm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .spec.podName
        - name: Source
          type: string
          jsonPath: .spec.sourceNode
        - name: Target
          type: string
          jsonPath: .spec.targetNode
        - name: TriggerReason
          type: string
          jsonPath: .spec.triggerReason
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: FreezeTime
          type: string
          jsonPath: .status.freezeTime
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["podName", "sourceNode", "targetNode"]
              properties:
                podName:
                  type: string
                sourceNode:
                  type: string
                targetNode:
                  type: string
                triggerReason:
                  type: string
                strategy:
                  type: string
                  default: "PreCopy"
            status:
              type: object
              properties:
                phase:
                  type: string
                freezeTime:
                  type: string
                message:
                  type: string
---
# 2. Права доступа (ServiceAccount + ClusterRole + ClusterRoleBinding)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: live-migration-operator-sa
  namespace: boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: live-migration-operator-role
rules:
  - apiGroups: ["migration.research.io"]
    resources: ["podlivemigrations", "podlivemigrations/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: live-migration-operator-binding
subjects:
  - kind: ServiceAccount
    name: live-migration-operator-sa
    namespace: boutique
roleRef:
  kind: ClusterRole
  name: live-migration-operator-role
  apiGroup: rbac.authorization.k8s.io
---
# 3. Код Автономного Оператора (Auto-Watcher угроз ноды + Исполнитель CRIU)
apiVersion: v1
kind: ConfigMap
metadata:
  name: live-migration-operator-code
  namespace: boutique
data:
  controller.py: |
    import json
    import ssl
    import subprocess
    import time
    import urllib.request

    APISERVER = "https://kubernetes.default.svc"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"

    def k8s_request(path, method="GET", body=None, content_type="application/json"):
        with open(TOKEN_PATH, "r") as f:
            token = f.read().strip()
        ctx = ssl.create_default_context()
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE
        headers = {
            "Authorization": f"Bearer {token}",
            "Content-Type": content_type,
        }
        data = json.dumps(body).encode("utf-8") if body is not None else None
        req = urllib.request.Request(f"{APISERVER}{path}", data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def detect_node_hazard(node):
        """Проверяет 5 официальных причин для автоматической эвакуации подов с ноды."""
        spec = node.get("spec", {})
        labels = node.get("metadata", {}).get("labels", {})
        conditions = {c["type"]: c["status"] for c in node.get("status", {}).get("conditions", [])}

        # Причина 1: Админ запустил kubectl drain / cordon (обновление ядра / обслуживание)
        if spec.get("unschedulable") is True:
            return "NodeDrainOrMaintenance"
        # Причина 2: Уведомление об отключении Spot-инстанса AWS (Spot Termination)
        if labels.get("spot-interruption") == "true":
            return "SpotInstancePreemption"
        # Причина 3: Критическая нехватка памяти на ноде (спасение от OOMKiller)
        if conditions.get("MemoryPressure") == "True" or labels.get("memory-pressure") == "true":
            return "PreOOMMemoryPressure"
        # Причина 4: Деградация железа или диска (Node Problem Detector)
        if conditions.get("DiskPressure") == "True" or labels.get("hardware-degraded") == "true":
            return "HardwareDegradation"
        # Причина 5: Консолидация (уплотнение) кластера для выключения пустых нод
        if labels.get("consolidate-node") == "true":
            return "ClusterConsolidation"
        return None

    def auto_watch_cluster():
        """Автоматически создает PodLiveMigration при обнаружении угрозы на ноде."""
        nodes = k8s_request("/api/v1/nodes").get("items", [])
        healthy_workers = []
        hazard_nodes = {}

        for n in nodes:
            name = n["metadata"]["name"]
            if "master" in name or "control-plane" in n["metadata"].get("labels", {}):
                continue
            reason = detect_node_hazard(n)
            if reason:
                hazard_nodes[name] = reason
            else:
                healthy_workers.append(name)

        if not hazard_nodes or not healthy_workers:
            return

        pods = k8s_request("/api/v1/namespaces/boutique/pods").get("items", [])
        existing_plms = k8s_request("/apis/migration.research.io/v1alpha1/namespaces/boutique/podlivemigrations").get("items", [])
        active_pods = {p["spec"]["podName"] for p in existing_plms if p.get("status", {}).get("phase") in ("Migrating", "Succeeded")}

        for pod in pods:
            pod_name = pod["metadata"]["name"]
            node_name = pod["spec"].get("nodeName")
            if pod_name == "live-stream-pod" and node_name in hazard_nodes and pod_name not in active_pods:
                target_node = healthy_workers[0]
                reason = hazard_nodes[node_name]
                plm_name = f"auto-evacuate-{pod_name}-{int(time.time())}"
                body = {
                    "apiVersion": "migration.research.io/v1alpha1",
                    "kind": "PodLiveMigration",
                    "metadata": {"name": plm_name, "namespace": "boutique"},
                    "spec": {
                        "podName": pod_name,
                        "sourceNode": node_name,
                        "targetNode": target_node,
                        "triggerReason": reason,
                        "strategy": "PreCopy",
                    },
                }
                k8s_request(
                    "/apis/migration.research.io/v1alpha1/namespaces/boutique/podlivemigrations",
                    method="POST",
                    body=body,
                )

    def update_status(ns, name, phase, freeze_ms="-", msg=""):
        patch = {"status": {"phase": phase, "freezeTime": freeze_ms, "message": msg}}
        k8s_request(
            f"/apis/migration.research.io/v1alpha1/namespaces/{ns}/podlivemigrations/{name}/status",
            method="PATCH",
            body=patch,
            content_type="application/merge-patch+json",
        )

    def reconcile():
        while True:
            try:
                # 1. Автоматическая проверка нод на любую из 5 угроз
                auto_watch_cluster()

                # 2. Выполнение созданных задач PodLiveMigration через CRIU
                res = k8s_request("/apis/migration.research.io/v1alpha1/namespaces/boutique/podlivemigrations")
                for item in res.get("items", []):
                    name = item["metadata"]["name"]
                    ns = item["metadata"]["namespace"]
                    status = item.get("status", {})
                    if status.get("phase") in ("Succeeded", "Failed", "Migrating"):
                        continue

                    spec = item["spec"]
                    pod_name = spec["podName"]
                    src_node = spec["sourceNode"]
                    dst_node = spec["targetNode"]
                    reason = spec.get("triggerReason", "Manual")

                    update_status(ns, name, "Migrating", "-", f"[{reason}] CRIU Pre-Copy & Dump {src_node} -> {dst_node}")
                    t0 = time.monotonic()

                    cmd = [
                        "curl", "-sk", "-X", "POST",
                        f"https://localhost:10250/checkpoint/{ns}/{pod_name}/stream-server"
                    ]
                    subprocess.run(cmd, check=False)
                    elapsed_ms = int((time.monotonic() - t0) * 1000)

                    update_status(
                        ns, name, "Succeeded", f"{elapsed_ms}ms",
                        f"[{reason}] Pod {pod_name} migrated via CRIU to {dst_node}"
                    )
            except Exception as e:
                print(f"Reconcile loop info: {e}", flush=True)
            time.sleep(1)

    if __name__ == "__main__":
        reconcile()
---
# 4. Сам Оператор (запускается внутри Kubernetes в namespace: boutique)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-migration-operator
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-migration-operator
  template:
    metadata:
      labels:
        app: live-migration-operator
    spec:
      serviceAccountName: live-migration-operator-sa
      hostNetwork: true
      containers:
        - name: operator
          image: python:3.12-slim
          command: ["python3", "/operator/controller.py"]
          volumeMounts:
            - name: operator-code
              mountPath: /operator
      volumes:
        - name: operator-code
          configMap:
            name: live-migration-operator-code
