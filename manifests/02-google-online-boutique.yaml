---
# In-memory Redis хранилище корзины Google Online Boutique (redis-cart)
# Также используется в scripts/benchmark_migration.py как Baseline 2 (Redis-репликация состояния)
# для сравнения с прозрачной миграцией памяти контейнера через CRI-O + CRIU (live-stream-pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: boutique
spec:
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-1
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: boutique
spec:
  type: ClusterIP
  selector:
    app: redis-cart
  ports:
  - name: tcp-redis
    port: 6379
    targetPort: 6379
---
