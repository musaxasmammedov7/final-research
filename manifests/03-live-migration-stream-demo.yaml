# ==============================================================================
# Kubernetes Service + Static Endpoint (10.244.88.10:8090)
# Интегрирует мигрирующий через CRIU контейнер в Cilium Service Mesh (eBPF LB)
# и Cilium Ingress Controller (https://musa-research.duckdns.org/live)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: live-stream-service
  namespace: boutique
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: Endpoints
metadata:
  name: live-stream-service
  namespace: boutique
subsets:
  - addresses:
      - ip: 10.244.88.10
    ports:
      - name: http
        port: 8090
