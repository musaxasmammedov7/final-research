# ==============================================================================
# ВИЗУАЛЬНЫЙ ЦЕНТР МИГРАЦИИ ПАМЯТИ (CRI-O + CRIU + Buildah + Cilium eBPF)
# ------------------------------------------------------------------------------
# Открывается по адресу: https://musa-research.duckdns.org/live
# - automountServiceAccountToken: false (нулевые внешние тома для чистого CRIU dump/restore)
# - Отсутствие исходящих TCP-соединений (чистый слушающий сокет 0.0.0.0:8090 HTTP/1.0)
# - Динамическое определение нового Pod IP через локальную таблицу маршрутизации ядра
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: live-stream-pod
  namespace: boutique
  labels:
    app: live-stream
spec:
  automountServiceAccountToken: false
  nodeName: k8s-worker-1
  tolerations:
    - operator: Exists
  containers:
    - name: stream-server
      image: docker.io/library/python:3.12-slim
      command:
        - python3
        - -c
        - |
          import http.server, json, os, socket, time
          from threading import Thread

          STATE = {
              "ram_counter": 0,
              "started_at": time.strftime("%H:%M:%S"),
              "pid": os.getpid(),
              "node": "k8s-worker-1",
              "migrations": [],
          }

          def counter_loop():
              while True:
                  STATE["ram_counter"] += 1
                  time.sleep(0.1)

          Thread(target=counter_loop, daemon=True).start()

          def get_current_pod_ip():
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  s.connect(("10.10.1.10", 80))
                  ip = s.getsockname()[0]
                  s.close()
                  return ip
              except Exception:
                  return "unknown"

          HTML = """<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>CRI-O + CRIU Stateful Migration</title>
          <style>
            body { font-family: system-ui, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 24px; }
            .wrap { max-width: 1120px; margin: 0 auto; }
            .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; }
            .top a { color: #38bdf8; text-decoration: none; font-weight: 600; background: #1e293b; padding: 8px 14px; border-radius: 8px; }
            .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
            .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; }
            .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
            .val { font-size: 24px; font-weight: 700; margin-top: 6px; font-family: monospace; color: #38bdf8; }
            .ok { color: #4ade80; }
            .pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
            .step { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
            .step.active { border-color: #4ade80; background: #06281e; }
            .step h4 { margin: 0 0 6px 0; font-size: 14px; }
            .step p { margin: 0; font-size: 12px; color: #94a3b8; line-height: 1.4; }
            table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
            th, td { text-align: left; padding: 10px; border-bottom: 1px solid #1f2937; font-family: monospace; }
          </style></head><body><div class="wrap">
            <div class="top">
              <div>
                <h2 style="margin:0;">🚀 Стенд миграции состояния RAM (CRI-O + CRIU + Buildah + Cilium eBPF)</h2>
                <p style="margin:4px 0 0; color:#94a3b8; font-size:14px;">Эталонный конвейер KEP-2008: Kubelet Checkpoint &rarr; Buildah OCI Image &rarr; CRI-O Restore на целевой ноде</p>
              </div>
              <a href="/">🛒 Магазин Google Boutique &rarr;</a>
            </div>
            <div class="grid">
              <div class="card"><div class="label">Счетчик в памяти RAM (CRIU)</div><div class="val ok" id="counter">0</div></div>
              <div class="card"><div class="label">Текущая физическая нода</div><div class="val ok" id="node">...</div></div>
              <div class="card"><div class="label">Pod IP и PID</div><div class="val" id="pod_ip">...</div></div>
              <div class="card"><div class="label">Макс. пауза клиента (HTTP Gap)</div><div class="val" id="max_gap">0 ms</div></div>
            </div>
            <h3 style="margin-top:24px; margin-bottom:8px; font-size:15px;">Реальный 4-этапный конвейер миграции контейнера:</h3>
            <div class="pipeline">
              <div class="step" id="st1"><h4>1. Kubelet Checkpoint API</h4><p>Вызов <code>POST /checkpoint</code> в CRI-O на исходной ноде. CRIU сохраняет страницы RAM в tar-архив (<code>T_dump</code>).</p></div>
              <div class="step" id="st2"><h4>2. Buildah OCI Packaging</h4><p>Упаковка архива CRIU в OCI-образ с аннотацией <code>io.kubernetes.cri-o.annotations.checkpoint.name</code> (<code>T_build</code>).</p></div>
              <div class="step" id="st3"><h4>3. Registry Transfer</h4><p>Передача OCI-образа чекпоинта через локальный реестр кластера на целевую ноду (<code>T_transfer</code>).</p></div>
              <div class="step" id="st4"><h4>4. CRI-O Restore &amp; Cilium</h4><p>CRI-O распаковывает дамп через <code>criu restore</code> (счетчик RAM продолжается с момента дампа!), Cilium eBPF обновляет Endpoint (<code>T_restore</code>).</p></div>
            </div>
            <div class="card" style="margin-top:20px;">
              <div class="label">Журнал оператора (<code>kubectl get podlivemigrations -n boutique</code>):</div>
              <table><thead><tr><th>Задача</th><th>Маршрут</th><th>Триггер</th><th>Фаза</th><th>Полный пайплайн</th><th>Разбивка фаз и состояние счетчика (Dump &rarr; Kill &rarr; Restore)</th></tr></thead>
              <tbody id="plm_body"><tr><td colspan="6" style="color:#64748b;">Ожидание триггера (например: <code>kubectl cordon k8s-worker-1</code>)...</td></tr></tbody></table>
            </div>
          </div>
          <script>
            let lastTs = performance.now(), maxGap = 0;
            async function poll() {
              try {
                const r = await fetch('/live/state', { cache: 'no-store' });
                const d = await r.json();
                const now = performance.now(), gap = Math.round(now - lastTs);
                if (gap > maxGap && lastTs > 0) maxGap = gap;
                lastTs = now;
                document.getElementById('counter').innerText = d.ram_counter;
                document.getElementById('node').innerText = d.node;
                document.getElementById('pod_ip').innerText = d.pod_ip + ' (PID ' + d.pid + ')';
                document.getElementById('max_gap').innerText = maxGap + ' ms';
                if (d.migrations && d.migrations.length > 0) {
                  for (let i = 1; i <= 4; i++) document.getElementById('st' + i).classList.add('active');
                  document.getElementById('plm_body').innerHTML = d.migrations.map(m => `<tr><td>${m.name}</td><td>${m.source} &rarr; ${m.target}</td><td>${m.reason}</td><td style="color:#4ade80;font-weight:700;">${m.phase}</td><td>${m.downtime}</td><td>${m.breakdown}</td></tr>`).join('');
                }
              } catch (e) {}
              setTimeout(poll, 200);
            }
            poll();
          </script></body></html>"""

          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"
              def log_message(self, *a): return
              def do_GET(self):
                  if self.path.startswith("/live/state"):
                      body = json.dumps({
                          "ram_counter": STATE["ram_counter"],
                          "node": STATE["node"],
                          "pod_ip": get_current_pod_ip(),
                          "pid": STATE["pid"],
                          "migrations": STATE["migrations"],
                      }).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(HTML.encode("utf-8"))

              def do_POST(self):
                  if self.path.startswith("/live/record"):
                      length = int(self.headers.get("Content-Length", "0"))
                      payload = json.loads(self.rfile.read(length).decode("utf-8"))
                      STATE["node"] = payload.get("target", STATE["node"])
                      STATE["migrations"].append(payload)
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(b'{"ok":true}')

          http.server.ThreadingHTTPServer(("0.0.0.0", 8090), H).serve_forever()
      ports:
        - containerPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: live-stream-service
  namespace: boutique
spec:
  type: ClusterIP
  selector:
    app: live-stream
  ports:
    - name: http
      port: 8090
      targetPort: 8090
